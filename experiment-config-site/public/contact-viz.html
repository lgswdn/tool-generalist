<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tool Contact Viz</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="contact-viz-page">
    <header class="topbar contact-topbar">
      <div>
        <p class="eyebrow">tool_contact_viz</p>
        <h1>Tool Contact Viz</h1>
      </div>
      <div class="toolbar contact-toolbar">
        <a class="nav-link" href="/">实验配置</a>
        <select id="groupSelect" aria-label="选择图片组"></select>
        <button id="prevButton" class="ghost-button" type="button">上一组</button>
        <button id="nextButton" class="ghost-button" type="button">下一组</button>
      </div>
    </header>

    <main class="contact-layout">
      <section class="contact-viewer" aria-live="polite">
        <div class="contact-image-stage">
          <img id="preImage" alt="" />
          <img id="postImage" alt="" />
          <div id="loadingState" class="contact-loading">加载中</div>
        </div>
      </section>

      <aside class="contact-controls" aria-label="显示控制">
        <div class="contact-title-block">
          <span id="groupCounter" class="artifact-kind">0 / 0</span>
          <h2 id="groupTitle">加载中</h2>
        </div>

        <div class="control-row">
          <label class="toggle-control">
            <input id="autoToggle" type="checkbox" checked />
            <span>自动切换</span>
          </label>
          <span id="currentFrameLabel" class="status-pill">Pre</span>
        </div>

        <label class="field-control">
          <span>切换间隔</span>
          <input id="intervalInput" type="range" min="100" max="3000" step="50" value="650" />
          <strong id="intervalLabel">650 ms</strong>
        </label>

        <div class="segmented-control" role="group" aria-label="当前图片">
          <button id="showPreButton" type="button" class="active">Pre</button>
          <button id="showPostButton" type="button">Post</button>
        </div>

        <label class="field-control">
          <span>组索引</span>
          <input id="groupSlider" type="range" min="0" max="0" step="1" value="0" />
          <strong id="groupIndexLabel">000</strong>
        </label>

        <div class="param-list compact">
          <div class="param-row">
            <span class="param-key">Pre</span>
            <span id="preFileLabel" class="param-value"></span>
          </div>
          <div class="param-row">
            <span class="param-key">Post</span>
            <span id="postFileLabel" class="param-value"></span>
          </div>
        </div>
      </aside>
    </main>

    <script src="/contact-viz.js" type="module"></script>
  </body>
</html>
